name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: buildinator-5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test script
        run: ./test_builds.sh

      - name: Set artifact timestamp
        if: always()
        run: echo "TS=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpi3mr-test-build-logs_${{ env.TS }}
          path: |
            test_builds_out/**/*.log
            test_builds_out.log
          retention-days: 7
